name: Compilar APK y publicar
on:
  push:
    paths: ["AsistenteLGCP-Android.zip", ".github/workflows/compilar.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - name: Descomprimir proyecto
        run: unzip -q AsistenteLGCP-Android.zip -d src
      - name: Compilar
        working-directory: src/AsistenteLGCP
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../AsistenteLGCP.apk
      - name: Publicar Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v2.0-${{ github.run_number }}"
          gh release create "$TAG" AsistenteLGCP.apk --repo "${{ github.repository }}" \
            --title "Asistente LGCP $TAG" --latest \
            --notes "APK para Android 8.0 o superior. Descargue AsistenteLGCP.apk, ábralo y permita instalar apps de origen desconocido."
