name: Compilar APK y publicar
on:
  push:
    paths: ["AsistenteLGCP-Android.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Descomprimir proyecto
        run: unzip -q AsistenteLGCP-Android.zip -d src
      - name: Compilar
        working-directory: src/AsistenteLGCP
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../AsistenteLGCP.apk
      - name: Publicar Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v2.0-${{ github.run_number }}"
          gh release create "$TAG" AsistenteLGCP.apk --repo "${{ github.repository }}" \
            --title "Asistente LGCP $TAG" --latest \
            --notes "APK para Android 8.0 o superior. Descargue AsistenteLGCP.apk, ábralo y permita instalar apps de origen desconocido."
